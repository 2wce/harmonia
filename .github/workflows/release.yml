name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: >-
          node --input-type=module -e 'import fs from "node:fs"; const version =
          JSON.parse(fs.readFileSync("package.json", "utf8")).version; if
          (process.env.GITHUB_REF_NAME.slice(1) !== version) process.exit(1)'
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm pack:check
      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
